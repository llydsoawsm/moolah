name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🛠️ Expo Prebuild iOS
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          npx expo prebuild --platform ios --clean --no-install

      - name: 🔨 Install CocoaPods
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          npx pod-install ios

      - name: 🏗️ Compile Xcode Project (Unsigned Release)
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          WORKSPACE_PATH=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | awk '/Schemes:/{getline; print $1}')
          echo "Building workspace: $WORKSPACE_PATH with scheme: $SCHEME_NAME"
          
          xcodebuild -workspace "$WORKSPACE_PATH" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER=""

      - name: 📦 Package .ipa Archive
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Packaging application from: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 moolah.ipa Payload

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moolah-ios-ipa
          path: moolah.ipa
          retention-days: 14
